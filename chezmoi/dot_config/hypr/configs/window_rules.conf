# TransAI 窗口规则
windowrule {
    name = transai-float
    match:class = ^(TransAI)$
    float = true
    size = 800 600
}

# GPT Translator 窗口规则
windowrule {
    name = gpt-translator
    match:title = ^(GPT Translator)$
    float = true
}

# Minecraft 窗口规则
windowrule {
    name = minecraft-size
    match:class = ^(Minecraft).*$
    size = 1920 1080
}

# DOOM 窗口规则
windowrule {
    name = doom-size
    match:class = ^(DOOM).*$
    size = 1920 1080
}

# 画中画窗口规则
windowrule {
    name = pip-window
    match:title = ^(Picture in picture)$
    float = true
    pin = true
}

# Wine 应用不浮窗显示
windowrule {
    name = wine-no-float-1
    match:class = ^(wine)$
    float = false
}

windowrule {
    name = wine-no-float-2
    match:class = ^(Wine)$
    float = false
}

# 强制 Dunst 置顶显示
windowrule {
    name = dunst-notification
    match:class = ^(Dunst)$
    pin = true
}
